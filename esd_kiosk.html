<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ESD Kiosk</title>
<script>
  // GPU-Init-Fix: prüfen ob Seite gerendert, sonst neu laden
  function checkRender() {
    var bg = window.getComputedStyle(document.body).backgroundColor;
    if (bg === 'rgb(255, 255, 255)' || bg === 'rgba(0, 0, 0, 0)' || bg === '') {
      location.reload();
    }
  }
  setTimeout(checkRender, 3000);
  setTimeout(checkRender, 7000);
  setTimeout(checkRender, 12000);
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --clr-bg:      #1a1a2e;
    --clr-panel:   #16213e;
    --clr-accent:  #0f3460;
    --clr-blue:    #1a73e8;
    --clr-green:   #1b8a3e;
    --clr-red:     #c0392b;
    --clr-yellow:  #f39c12;
    --clr-text:    #e0e0e0;
    --clr-muted:   #888;
    --radius:      16px;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--clr-bg);
    color: var(--clr-text);
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }

  /* ---- SCREENS ---- */
  .screen {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .screen.active { display: flex; }

  /* ---- IDLE ---- */
  #screen-idle { background: var(--clr-bg); }
  #screen-idle .idle-title {
    font-size: clamp(2rem, 6vw, 4.5rem);
    font-weight: 700;
    line-height: 1.2;
    max-width: 900px;
  }
  #screen-idle .mic-hint {
    margin-top: 24px;
    font-size: 1rem;
    color: var(--clr-muted);
    display: flex; align-items: center; gap: 8px;
  }
  #mic-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--clr-muted);
    transition: background .3s;
  }
  #mic-dot.active { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }

  /* ---- BEEP1 ---- */
  #screen-beep1 { background: var(--clr-bg); }
  #screen-beep1 .b1-title {
    font-size: clamp(1.6rem, 4vw, 3rem);
    font-weight: 600;
    margin-bottom: 32px;
  }
  .spinner {
    width: 72px; height: 72px;
    border: 6px solid rgba(26,115,232,.25);
    border-top-color: var(--clr-blue);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- SUCCESS ---- */
  #screen-success { background: var(--clr-panel); justify-content: space-between; padding: 40px 32px; }
  .success-icon svg { width: clamp(80px,14vw,140px); height: auto; }
  .success-title {
    font-size: clamp(1.8rem, 4.5vw, 3.5rem);
    font-weight: 700;
    margin-top: 16px;
  }
  .success-sub {
    font-size: clamp(1rem, 2.2vw, 1.5rem);
    color: var(--clr-muted);
    margin-top: 8px;
  }
  .btn-manual {
    margin-top: 32px;
    padding: 18px 48px;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    font-weight: 600;
    background: var(--clr-blue);
    color: #fff;
    border: none; border-radius: var(--radius);
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .btn-manual:active { transform: scale(.97); background: #155bb5; }

  /* Timer ring */
  #timer-wrap {
    position: fixed; bottom: 20px; right: 20px;
    width: 64px; height: 64px;
  }
  #timer-wrap svg { width: 64px; height: 64px; transform: rotate(-90deg); }
  #timer-ring    { stroke: var(--clr-blue); stroke-width: 5; fill: none;
    stroke-dasharray: 175.9; stroke-dashoffset: 0; transition: stroke-dashoffset .9s linear; }
  #timer-ring-bg { stroke: rgba(255,255,255,.12); stroke-width: 5; fill: none; }
  #timer-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 700;
  }

  /* warn flash */
  #warn-overlay {
    position: fixed; inset: 0;
    background: rgba(243,156,18,.18);
    display: none; align-items: center; justify-content: center;
    font-size: clamp(1.2rem,3vw,2.2rem);
    font-weight: 700; color: var(--clr-yellow);
    pointer-events: none; z-index: 50;
  }
  #warn-overlay.show { display: flex; }

  /* ---- NUMPAD ---- */
  #screen-numpad {
    background: var(--clr-panel);
    display: none;
    flex-direction: row;
    align-items: stretch;
    justify-content: center;
    gap: 32px;
    padding: 32px;
  }
  #screen-numpad.active { display: flex; }

  .numpad-left {
    flex: 1; max-width: 340px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 20px;
  }
  .numpad-heading {
    font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    font-weight: 700; text-align: center;
  }
  .numpad-display {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    letter-spacing: .18em;
    background: var(--clr-accent);
    border-radius: var(--radius);
    padding: 16px 32px;
    min-width: 240px; text-align: center;
    color: #fff;
  }
  .numpad-hint { font-size: .9rem; color: var(--clr-muted); text-align: center; }
  .btn-back, .btn-abort {
    width: 100%; padding: 16px;
    font-size: 1.1rem; font-weight: 600;
    border: none; border-radius: var(--radius);
    cursor: pointer; transition: background .2s, transform .1s;
  }
  .btn-back  { background: var(--clr-accent); color: #fff; }
  .btn-abort { background: rgba(192,57,43,.25); color: #e74c3c; }
  .btn-back:active, .btn-abort:active { transform: scale(.97); }

  .numpad-right {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    flex: 0 0 auto;
    width: min(320px, 45vw);
  }
  .np-btn {
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.4rem, 3.5vw, 2.2rem);
    font-weight: 700;
    background: var(--clr-accent);
    color: var(--clr-text);
    border: none; border-radius: var(--radius);
    cursor: pointer;
    transition: background .15s, transform .1s;
    min-height: 70px;
  }
  .np-btn:active { background: var(--clr-blue); transform: scale(.94); }
  .np-btn.del  { background: rgba(192,57,43,.3); color: #e74c3c; }
  .np-btn.ok   { background: #1b8a3e; color: #fff; }
  .np-btn.ok:active { background: #146230; }

  /* ---- SAVED ---- */
  #screen-saved { background: var(--clr-green); }
  #screen-saved .saved-icon { font-size: clamp(3rem, 10vw, 7rem); }
  #screen-saved .saved-text {
    margin-top: 16px;
    font-size: clamp(1.5rem, 4vw, 3rem);
    font-weight: 700;
  }

  /* ---- FAIL ---- */
  #screen-fail { background: var(--clr-red); }
  #screen-fail .fail-icon { font-size: clamp(3rem, 10vw, 7rem); }
  #screen-fail .fail-text {
    margin-top: 16px;
    font-size: clamp(1.5rem, 4vw, 3rem);
    font-weight: 700;
  }
  #fail-countdown { margin-top: 12px; font-size: 1.1rem; color: rgba(255,255,255,.75); }

  /* ---- SETTINGS ---- */
  #settings-btn {
    position: fixed; top: 10px; right: 10px;
    width: 36px; height: 36px;
    background: rgba(255,255,255,.08);
    border: none; border-radius: 50%;
    color: var(--clr-muted); font-size: 1.1rem;
    cursor: pointer; z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  #settings-panel {
    position: fixed; top: 54px; right: 10px;
    background: var(--clr-panel);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: var(--radius);
    padding: 20px; width: 280px;
    display: none; z-index: 100;
    font-size: .9rem;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  #settings-panel.open { display: block; }
  #settings-panel label { display: block; margin-bottom: 4px; color: var(--clr-muted); }
  #settings-panel input[type=number] {
    width: 100%; padding: 8px 10px;
    background: var(--clr-accent); color: var(--clr-text);
    border: 1px solid rgba(255,255,255,.15); border-radius: 8px;
    font-size: 1rem; margin-bottom: 12px;
  }
  #settings-panel .save-cfg {
    width: 100%; padding: 10px;
    background: var(--clr-blue); color: #fff;
    border: none; border-radius: 8px;
    font-size: 1rem; cursor: pointer;
  }

  /* ---- PIN OVERLAY ---- */
  #pin-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center;
    z-index: 200;
  }
  #pin-overlay.open { display: flex; }
  #pin-box {
    background: var(--clr-panel);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: var(--radius);
    padding: 24px; width: 260px;
    box-shadow: 0 12px 40px rgba(0,0,0,.7);
    text-align: center;
  }
  #pin-title { font-size: 1rem; color: var(--clr-muted); margin-bottom: 16px; }
  #pin-dots {
    display: flex; justify-content: center; gap: 16px;
    margin-bottom: 20px;
  }
  .pin-dot {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.3);
    background: transparent;
    transition: background .15s, border-color .15s;
  }
  .pin-dot.filled { background: var(--clr-blue); border-color: var(--clr-blue); }
  .pin-dot.error  { background: var(--clr-red);  border-color: var(--clr-red);  }
  #pin-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .pin-btn {
    padding: 14px 0;
    font-size: 1.3rem; font-weight: 700;
    background: var(--clr-accent); color: var(--clr-text);
    border: none; border-radius: 10px;
    cursor: pointer; transition: background .15s, transform .1s;
  }
  .pin-btn:active { background: var(--clr-blue); transform: scale(.93); }
  .pin-btn.del { background: rgba(192,57,43,.3); color: #e74c3c; }
  .pin-btn.cancel { background: rgba(255,255,255,.06); color: var(--clr-muted); font-size: .9rem; }
  @keyframes pinShake {
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 60%{transform:translateX(8px)}
  }
  .pin-shake { animation: pinShake .35s ease; }
</style>
</head>
<body>

<!-- IDLE -->
<div id="screen-idle" class="screen active">
  <div class="idle-title">Bitte ESD Test durchführen</div>

</div>

<!-- BEEP 1 DETECTED -->
<div id="screen-beep1" class="screen">
  <div class="b1-title">ESD Test gestartet…</div>
  <div class="spinner"></div>

<!-- SUCCESS (Scan-Fenster) -->
<div id="screen-success" class="screen">
  <div style="display:flex;flex-direction:column;align-items:center;">
    <div class="success-icon">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4"  y="4"  width="8"  height="24" fill="#1a73e8" rx="2"/>
        <rect x="14" y="4"  width="4"  height="24" fill="#1a73e8" rx="1"/>

        <rect x="50" y="4"  width="6"  height="24" fill="#1a73e8" rx="1"/>

        <rect x="14" y="36" width="4"  height="24" fill="#1a73e8" rx="1"/>

        <rect x="28" y="36" width="4"  height="24" fill="#1a73e8" rx="1"/>
        <rect x="34" y="36" width="8"  height="24" fill="#1a73e8" rx="2"/>
        <rect x="44" y="36" width="4"  height="24" fill="#1a73e8" rx="1"/>
        <rect x="50" y="36" width="6"  height="24" fill="#1a73e8" rx="1"/>

  <div id="pin-box">
    <div id="pin-title">PIN eingeben</div>
    <div id="pin-dots">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
    </div>
    <div id="pin-grid"></div>
  </div>
</div>

<script>
"use strict";

// ================================================================
// KONFIGURATION
// ================================================================
const CFG = {
  get freq()      { return parseFloat(localStorage.getItem('freq'))  || 4146; },
  get tolerance() { return parseFloat(localStorage.getItem('tol'))   || 350;  },
  get winSec()    { return parseFloat(localStorage.getItem('win'))   || 2.5;  },
  get amp()       { return parseFloat(localStorage.getItem('amp'))   || 28;   },
};
const SESSION_SEC  = 30;
const BEEP_MIN_MS  = 120;
const BEEP_GAP_MIN = 200;
const COOLDOWN_MS  = 5000;
const CIRCUMFERENCE = 2 * Math.PI * 28; // 175.93

// ================================================================
// APP STATE
// ================================================================
let appState = 'idle';
let sessionTimer = null, sessionEnd = 0;
let failTimer    = null;
let timerRAF     = null;
let scanBuf      = '', scanTimer = null;
let numBuf       = '';

function setAppState(s) {
  appState = s;
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('screen-' + s).classList.add('active');

  clearTimeout(sessionTimer);
  clearTimeout(failTimer);
  cancelAnimationFrame(timerRAF);

  if (s === 'success') {
    sessionEnd = Date.now() + SESSION_SEC * 1000;
    tickTimer();
  }

  if (s === 'fail') {
    let cd = 5;
    const el = document.getElementById('fail-countdown');
    el.textContent = 'Neuer Versuch in 5 s…';
    failTimer = setInterval(() => {
      cd--;
      el.textContent = cd > 0 ? `Neuer Versuch in ${cd} s…` : 'Bereit.';
      if (cd <= 0) { clearInterval(failTimer); setAppState('idle'); }
    }, 1000);
  }

  if (s === 'saved') {
    setTimeout(() => setAppState('idle'), 2000);
  }

  if (s === 'idle' || s === 'saved') {
    scanBuf = '';
    numBuf  = '';
    updateNumpadDisplay();
  }
}

// ---- Timer Ring ----
function tickTimer() {
  const rem  = Math.max(0, sessionEnd - Date.now());
  const secs = Math.ceil(rem / 1000);
  const off  = CIRCUMFERENCE * (1 - rem / (SESSION_SEC * 1000));
  document.getElementById('timer-ring').style.strokeDashoffset = off;
  document.getElementById('timer-label').textContent = secs;
  if (rem <= 0) { setAppState('idle'); return; }
  timerRAF = requestAnimationFrame(tickTimer);
}

// ================================================================
// NUMPAD
// ================================================================
(function buildNumpad() {
  const grid = document.getElementById('numpad-grid');
  [['7','8','9'],['4','5','6'],['1','2','3'],['DEL','0','OK']].forEach(row => {
    row.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'np-btn' + (k==='DEL'?' del':k==='OK'?' ok':'');
      btn.textContent = k === 'DEL' ? '⌫' : k;
      btn.addEventListener('click', () => numpadKey(k));
      grid.appendChild(btn);
    });
  });
})();

function updateNumpadDisplay() {
  const disp  = document.getElementById('numpad-display');
  const chars = Array.from({length:6}, (_,i) => i < numBuf.length ? numBuf[i] : '_');
  disp.textContent = chars.join(' ');
}

function numpadKey(k) {
  if (k === 'DEL') {
    numBuf = numBuf.slice(0, -1);
    updateNumpadDisplay();
  } else if (k === 'OK') {
    confirmNumpad();
  } else if (numBuf.length < 6) {
    numBuf += k;
    updateNumpadDisplay();
    if (numBuf.length === 6) confirmNumpad();
  }
}

function confirmNumpad() {
  const n = parseInt(numBuf, 10);
  if (numBuf.length !== 6 || n < 100000 || n > 109999) {
    flashWarn('Ungültige Nummer (100000–109999)');
    numBuf = '';
    updateNumpadDisplay();
    return;
  }
  sendData('', numBuf);
}

// ================================================================
// BARCODE SCANNER (USB HID = Tastatur)
// ================================================================
document.addEventListener('keydown', e => {
  if (appState !== 'success') {
    if (e.key === 'Enter' || e.key.length === 1) { e.preventDefault(); flashWarn(); }
    return;
  }
  if (e.key === 'Enter') {
    const code = scanBuf.trim(); scanBuf = '';
    if (code.length >= 3) sendData(code, '');
    return;
  }
  if (e.key.length === 1) {
    scanBuf += e.key;
    clearTimeout(scanTimer);
    scanTimer = setTimeout(() => { scanBuf = ''; }, 300);
  }
});

// ================================================================
// DATEN SENDEN  ->  lokaler Flask-Server (kein CORS!)
// ================================================================
async function sendData(barcode, personalnummer) {
  setAppState('saved'); // sofort Erfolgsmeldung zeigen
  try {
    const r = await fetch('/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ barcode, personalnummer })
    });
    const json = await r.json();
    if (!json.ok) console.warn('Server:', json.error);
  } catch (err) {
    // Offline oder Server nicht bereit — wird in esd_offline_log.csv gespeichert
    console.error('Verbindungsfehler:', err);
  }
}

// ================================================================
// WARN OVERLAY
// ================================================================
let warnTO = null;
function flashWarn(msg) {
  const el = document.getElementById('warn-overlay');
  el.textContent = msg || '⚠ Erst ESD Test durchführen!';
  el.classList.add('show');
  clearTimeout(warnTO);
  warnTO = setTimeout(() => el.classList.remove('show'), 1800);
}

// ================================================================
// AUDIO / BEEP-ERKENNUNG
// ================================================================
let audioCtx   = null;
let analyser   = null;
let dataArr    = null;
let beepPhase  = 'idle'; // idle | between | cooldown
let beep1End   = 0, betweenStart = 0;
let beepActive = false, beepStart = 0;

async function initAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.6;
    dataArr  = new Uint8Array(analyser.frequencyBinCount);
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    document.getElementById('mic-dot').classList.add('active');
    document.getElementById('mic-status').textContent = 'Mikrofon aktiv';
    audioLoop();
  } catch (err) {
    document.getElementById('mic-status').textContent = 'Mikrofon: Zugriff verweigert';
    console.error(err);
  }
}

function getAmp(hz) {
  const nyq = audioCtx.sampleRate / 2;
  const idx = Math.round(hz / nyq * analyser.frequencyBinCount);
  const lo  = Math.max(0, idx - 3);
  const hi  = Math.min(analyser.frequencyBinCount - 1, idx + 3);
  let max   = 0;
  for (let i = lo; i <= hi; i++) if (dataArr[i] > max) max = dataArr[i];
  return max;
}

function audioLoop() {
  requestAnimationFrame(audioLoop);
  analyser.getByteFrequencyData(dataArr);

  const isBeep = getAmp(CFG.freq) >= CFG.amp;
  const now    = Date.now();

  // Beep-Flanken erkennen
  if (isBeep && !beepActive) { beepActive = true; beepStart = now; }
  if (!isBeep && beepActive) {
    beepActive = false;
    if (now - beepStart >= BEEP_MIN_MS) onBeep(now);
  }

  // Timeout: kein 2. Beep -> Fail
  if (beepPhase === 'between' && (now - betweenStart) > CFG.winSec * 1000) {
    beepPhase = 'idle';
    if (appState === 'beep1') setAppState('fail');
  }
  // Cooldown beenden
  if (beepPhase === 'cooldown' && now > beep1End) beepPhase = 'idle';
}

function onBeep(now) {
  if (beepPhase === 'cooldown') return;

  if (beepPhase === 'idle') {
    beepPhase    = 'between';
    betweenStart = now;
    beep1End     = now;
    if (appState === 'idle') setAppState('beep1');
    return;
  }

  if (beepPhase === 'between') {
    const gap = now - beep1End;
    if (gap >= BEEP_GAP_MIN) {
      beepPhase = 'cooldown';
      beep1End  = now + COOLDOWN_MS;
      if (appState === 'beep1') setAppState('success');
    }
  }
}

// ================================================================
// PIN-SCHUTZ FUER EINSTELLUNGEN
// ================================================================
const SETTINGS_PIN = '4930';
let pinBuf = '';

(function buildPinGrid() {
  const grid = document.getElementById('pin-grid');
  [['7','8','9'],['4','5','6'],['1','2','3'],['Abbruch','0','⌫']].forEach(row => {
    row.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'pin-btn' +
        (k === '⌫'      ? ' del'    : '') +
        (k === 'Abbruch' ? ' cancel' : '');
      btn.textContent = k;
      btn.addEventListener('click', () => pinKey(k));
      grid.appendChild(btn);
    });
  });
})();

function openPinOverlay() {
  pinBuf = '';
  updatePinDots();
  document.getElementById('pin-overlay').classList.add('open');
}
function closePinOverlay() {
  document.getElementById('pin-overlay').classList.remove('open');
  pinBuf = '';
  updatePinDots();
}
function updatePinDots(state) {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById('pd' + i);
    d.classList.toggle('filled', i < pinBuf.length && state !== 'error');
    d.classList.toggle('error',  state === 'error');
  }
}
function pinKey(k) {
  if (k === 'Abbruch') { closePinOverlay(); return; }
  if (k === '⌫') {
    pinBuf = pinBuf.slice(0, -1);
    updatePinDots();
    return;
  }
  if (pinBuf.length >= 4) return;
  pinBuf += k;
  updatePinDots();
  if (pinBuf.length === 4) {
    if (pinBuf === SETTINGS_PIN) {
      closePinOverlay();
      openSettings();
    } else {
      updatePinDots('error');
      const box = document.getElementById('pin-box');
      box.classList.add('pin-shake');
      setTimeout(() => {
        box.classList.remove('pin-shake');
        pinBuf = '';
        updatePinDots();
      }, 400);
    }
  }
}

// ================================================================
// EINSTELLUNGEN
// ================================================================
function openSettings() {
  const p = document.getElementById('settings-panel');
  document.getElementById('cfg-freq').value = CFG.freq;
  document.getElementById('cfg-tol').value  = CFG.tolerance;
  document.getElementById('cfg-win').value  = CFG.winSec;
  document.getElementById('cfg-amp').value  = CFG.amp;
  p.classList.add('open');
}
function toggleSettings() { openPinOverlay(); }
function saveCfg() {
  localStorage.setItem('freq', document.getElementById('cfg-freq').value);
  localStorage.setItem('tol',  document.getElementById('cfg-tol').value);
  localStorage.setItem('win',  document.getElementById('cfg-win').value);
  localStorage.setItem('amp',  document.getElementById('cfg-amp').value);
  document.getElementById('settings-panel').classList.remove('open');
}

// ================================================================
// KIOSK BEENDEN: 5x ESC schnell hintereinander
// ================================================================
let escCount = 0, escTimer;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    escCount++;
    clearTimeout(escTimer);
    escTimer = setTimeout(() => { escCount = 0; }, 2000);
    if (escCount >= 5) {
      escCount = 0;
      fetch('/shutdown-kiosk', { method: 'POST' }).catch(() => {});
    }
  }
});

// ================================================================
// WAKE LOCK
// ================================================================
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible')
          await navigator.wakeLock.request('screen');
      });
    }
  } catch (e) { console.warn('WakeLock:', e); }
}

// ================================================================
// INIT
// ================================================================
window.addEventListener('load', () => {
  document.getElementById('timer-ring').style.strokeDasharray  = CIRCUMFERENCE;
  document.getElementById('timer-ring').style.strokeDashoffset = 0;
  requestWakeLock();
  initAudio();
});
</script>
